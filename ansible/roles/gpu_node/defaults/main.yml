---
# Driver branch (server/production branch). Must match the CUDA version your images need.
gpu_node_driver_branch: "580"
gpu_node_driver_package: "nvidia-driver-{{ gpu_node_driver_branch }}-server"
gpu_node_enable_persistence: true
gpu_node_container_runtime: containerd
# Kernel params for GPU + RDMA nodes
gpu_node_sysctls:
  net.core.rmem_max: 268435456
  net.core.wmem_max: 268435456
  vm.max_map_count: 262144
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
gpu_node_kernel_modules:
  - overlay
  - br_netfilter
