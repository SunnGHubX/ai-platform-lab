---
- name: Add NVIDIA Container Toolkit signing key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
    mode: "0644"

- name: Add NVIDIA Container Toolkit repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc]
      https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /
    filename: nvidia-container-toolkit
    state: present

- name: Install NVIDIA Container Toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true

- name: Check whether containerd already has the nvidia runtime
  ansible.builtin.command: grep -q 'nvidia-container-runtime' /etc/containerd/config.toml
  register: gpu_node_runtime_check
  changed_when: false
  failed_when: false

- name: Configure containerd to use the nvidia runtime
  ansible.builtin.command: nvidia-ctk runtime configure --runtime={{ gpu_node_container_runtime }}
  when: gpu_node_runtime_check.rc != 0
  changed_when: true
  notify: Restart containerd
