apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  labels:
    app.kubernetes.io/name: inference-gateway
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-gateway
    spec:
      serviceAccountName: inference-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inference-gateway
      containers:
        - name: gateway
          image: ghcr.io/sunnghubx/inference-gateway:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: UPSTREAM_URL
              value: http://vllm.inference.svc:8000
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: inference-gateway-api-keys   # synced from AWS Secrets Manager via External Secrets
                  key: keys
            - name: RATE_LIMIT_RPM
              value: "60"
            - name: MAX_TOKENS_CAP
              value: "1024"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
