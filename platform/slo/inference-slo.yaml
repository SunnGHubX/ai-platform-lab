# GENERATED by sre/slo/build.py from sre/slo/rules/ - edit the source, not this file.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inference-slo
  labels:
    app.kubernetes.io/part-of: ai-platform-lab
    role: slo
spec:
  groups:
  - name: inference-slo-recording
    interval: 30s
    rules:
    - record: slo:gateway_errors:ratio_rate5m
      expr: sum(rate(gateway_requests_total{code=~"5.."}[5m])) / sum(rate(gateway_requests_total[5m]))
    - record: slo:gateway_errors:ratio_rate30m
      expr: sum(rate(gateway_requests_total{code=~"5.."}[30m])) / sum(rate(gateway_requests_total[30m]))
    - record: slo:gateway_errors:ratio_rate1h
      expr: sum(rate(gateway_requests_total{code=~"5.."}[1h])) / sum(rate(gateway_requests_total[1h]))
    - record: slo:gateway_errors:ratio_rate6h
      expr: sum(rate(gateway_requests_total{code=~"5.."}[6h])) / sum(rate(gateway_requests_total[6h]))
    - record: slo:gateway_errors:ratio_rate1d
      expr: sum(rate(gateway_requests_total{code=~"5.."}[1d])) / sum(rate(gateway_requests_total[1d]))
    - record: slo:gateway_errors:ratio_rate3d
      expr: sum(rate(gateway_requests_total{code=~"5.."}[3d])) / sum(rate(gateway_requests_total[3d]))
    - record: slo:gateway_slow:ratio_rate5m
      expr: 1 - (sum(rate(gateway_request_duration_seconds_bucket{le="2.5"}[5m])) / sum(rate(gateway_request_duration_seconds_count[5m])))
    - record: slo:gateway_slow:ratio_rate1h
      expr: 1 - (sum(rate(gateway_request_duration_seconds_bucket{le="2.5"}[1h])) / sum(rate(gateway_request_duration_seconds_count[1h])))
    - record: slo:gateway_slow:ratio_rate30m
      expr: 1 - (sum(rate(gateway_request_duration_seconds_bucket{le="2.5"}[30m])) / sum(rate(gateway_request_duration_seconds_count[30m])))
    - record: slo:gateway_slow:ratio_rate6h
      expr: 1 - (sum(rate(gateway_request_duration_seconds_bucket{le="2.5"}[6h])) / sum(rate(gateway_request_duration_seconds_count[6h])))
  - name: inference-slo-alerts
    rules:
    - alert: InferenceAvailabilityFastBurn
      expr: slo:gateway_errors:ratio_rate1h > (14.4 * 0.005) and slo:gateway_errors:ratio_rate5m > (14.4 * 0.005)
      for: 2m
      labels:
        severity: page
        slo: inference-availability
      annotations:
        summary: Inference error budget burning 14.4x too fast
        description: More than 7.2% of gateway requests are failing over 1h and 5m. The 30-day error budget is gone in ~2 days at this rate.
        runbook_url: https://github.com/SunnGHubX/ai-platform-lab/blob/main/docs/runbooks/InferenceAvailabilityFastBurn.md
    - alert: InferenceAvailabilitySlowBurn
      expr: slo:gateway_errors:ratio_rate6h > (6 * 0.005) and slo:gateway_errors:ratio_rate30m > (6 * 0.005)
      for: 15m
      labels:
        severity: page
        slo: inference-availability
      annotations:
        summary: Inference error budget burning 6x too fast
        description: More than 3% of gateway requests are failing over 6h and 30m.
        runbook_url: https://github.com/SunnGHubX/ai-platform-lab/blob/main/docs/runbooks/InferenceAvailabilityFastBurn.md
    - alert: InferenceAvailabilityBudgetDrain
      expr: slo:gateway_errors:ratio_rate3d > 0.005 and slo:gateway_errors:ratio_rate1d > 0.005
      for: 1h
      labels:
        severity: ticket
        slo: inference-availability
      annotations:
        summary: Inference availability is trending to miss its 30-day SLO
        description: Error ratio has stayed above 0.5% for 3 days. Prioritise reliability work per the error budget policy.
        runbook_url: https://github.com/SunnGHubX/ai-platform-lab/blob/main/docs/runbooks/InferenceAvailabilityFastBurn.md
    - alert: InferenceLatencyFastBurn
      expr: slo:gateway_slow:ratio_rate1h > (14.4 * 0.05) and slo:gateway_slow:ratio_rate5m > (14.4 * 0.05)
      for: 2m
      labels:
        severity: page
        slo: inference-latency
      annotations:
        summary: Inference latency budget burning 14.4x too fast
        description: More than 72% of requests are slower than 2.5s over 1h and 5m.
        runbook_url: https://github.com/SunnGHubX/ai-platform-lab/blob/main/docs/runbooks/InferenceLatencyFastBurn.md
    - alert: InferenceLatencySlowBurn
      expr: slo:gateway_slow:ratio_rate6h > (6 * 0.05) and slo:gateway_slow:ratio_rate30m > (6 * 0.05)
      for: 15m
      labels:
        severity: page
        slo: inference-latency
      annotations:
        summary: Inference latency budget burning 6x too fast
        description: More than 30% of requests are slower than 2.5s over 6h and 30m.
        runbook_url: https://github.com/SunnGHubX/ai-platform-lab/blob/main/docs/runbooks/InferenceLatencyFastBurn.md
  - name: inference-saturation
    rules:
    - alert: VLLMQueueBacklog
      expr: sum(vllm:num_requests_waiting) > 20
      for: 10m
      labels:
        severity: ticket
      annotations:
        summary: vLLM has had more than 20 queued requests for 10 minutes
        description: KEDA should be adding replicas. Check for GPU capacity (Pending pods) or a stuck ScaledObject.
        runbook_url: https://github.com/SunnGHubX/ai-platform-lab/blob/main/docs/runbooks/VLLMQueueBacklog.md
    - alert: VLLMKVCacheSaturated
      expr: avg(vllm:kv_cache_usage_perc) > 0.95
      for: 15m
      labels:
        severity: ticket
      annotations:
        summary: vLLM KV cache above 95% for 15 minutes
        description: Requests are being preempted. Lower max-model-len, add replicas, or move to a larger GPU.
        runbook_url: https://github.com/SunnGHubX/ai-platform-lab/blob/main/docs/runbooks/VLLMQueueBacklog.md
