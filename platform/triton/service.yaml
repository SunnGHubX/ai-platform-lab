apiVersion: v1
kind: Service
metadata:
  name: triton
  labels:
    app.kubernetes.io/name: triton
spec:
  selector:
    app.kubernetes.io/name: triton
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: grpc
      port: 8001
      targetPort: grpc
    - name: metrics
      port: 8002
      targetPort: metrics
