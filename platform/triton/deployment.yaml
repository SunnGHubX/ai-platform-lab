apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton
  labels:
    app.kubernetes.io/name: triton
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: triton
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triton
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:26.08-py3
          args:
            - tritonserver
            - --model-repository=/models
            - --metrics-port=8002
            - --log-verbose=0
          ports:
            - name: http
              containerPort: 8000
            - name: grpc
              containerPort: 8001
            - name: metrics
              containerPort: 8002
          startupProbe:
            httpGet:
              path: /v2/health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: http
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
              # nvidia.com/gpu: 1   # uncomment for GPU models (KIND_GPU)
          volumeMounts:
            - name: model-add-sub
              mountPath: /models/add_sub
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: model-add-sub
          configMap:
            name: triton-model-add-sub
            items:
              - key: config.pbtxt
                path: config.pbtxt
              - key: model.py
                path: 1/model.py
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
