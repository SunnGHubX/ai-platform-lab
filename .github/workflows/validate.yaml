name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: yamllint
        run: pip install yamllint && yamllint .

      - name: shellcheck
        run: shellcheck bootstrap/*.sh

      - name: python syntax
        run: python -m py_compile scripts/*.py labs/*/*.py platform/triton/model_repository/add_sub/1/model.py

      - name: kustomize build + kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          for d in platform/*/; do
            [ -f "$d/kustomization.yaml" ] || continue
            echo "::group::$d"
            kubectl kustomize "$d" | ./kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            gitops/

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate (every module + stack, no backend)
        run: make validate

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: make lint
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint --init downloads the AWS ruleset

      - name: checkov (security scan, report-only)
        run: |
          pip install --quiet checkov
          checkov -d . --framework terraform --compact --quiet --soft-fail
