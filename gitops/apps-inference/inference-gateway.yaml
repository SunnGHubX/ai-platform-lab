apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SunnGHubX/ai-platform-lab.git
    targetRevision: main
    path: platform/inference-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
