      grep: { path: gitops/**/*.yaml, pattern: '(?i)istio|linkerd' }
    - name: ADR-0004 (mesh choice)
      file: docs/adr/0004-*.md
    - name: STRICT mTLS
      grep: { path: platform/**/*.yaml, pattern: '(?i)mode:\s*STRICT|all-authenticated' }
    - name: authorization by SPIFFE identity of the gateway
      grep: { path: platform/**/*.yaml, pattern: 'cluster\.local/ns/inference/sa/inference-gateway' }
    - name: authorization policy resource
      grep: { path: platform/**/*.yaml, pattern: 'kind:\s*(AuthorizationPolicy|ServerAuthorization|AuthorizationPolicy|MeshTLSAuthentication)' }

