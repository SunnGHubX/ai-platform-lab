    - name: ml-engineers group bound
      grep: { path: platform/rbac/*.yaml, pattern: 'ml-engineers' }
    - name: oncall group bound
      grep: { path: platform/rbac/*.yaml, pattern: 'oncall' }
    - name: impersonation verification matrix (>= 6 checks)
      grep: { path: platform/rbac/verify.sh, pattern: 'auth can-i', min: 6 }
    - name: Rego blocks bindings to system:authenticated
      grep: { path: policy/kubernetes/*.rego, pattern: 'system:authenticated' }
    - name: at least 4 RBAC Rego tests
      grep: { path: policy/kubernetes/*_test.rego, pattern: '(?im)^test_\w*(rbac|role|binding|wildcard)\w* if', min: 4 }
    - name: access_groups input on the EKS module
      grep: { path: terraform/modules/eks-cluster/variables.tf, pattern: 'variable "access_groups"' }
    - name: RBAC manifests build
      run: kubectl kustomize platform/rbac > /dev/null
      needs: [kubectl]
    - *conftest_verify
    - *conftest_platform

