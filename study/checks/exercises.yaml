"12":
  title: "Share GPUs: MIG and time-slicing with the GPU Operator"
  checks:
    - name: GPU Operator Argo CD app
      grep: { path: gitops/**/*.yaml, pattern: 'gpu-operator' }
    - name: time-slicing config
      grep: { path: platform/**/*.yaml, pattern: '(?i)time-?slicing|timeSlicing' }
    - name: MIG policy rule
      grep: { path: policy/kubernetes/*.rego, pattern: 'nvidia\.com/mig' }
    - name: MIG policy tested
      grep: { path: policy/kubernetes/*_test.rego, pattern: '(?i)^test_\w*mig\w* if' }
    - *conftest_verify

"13":
  title: Troubleshooting drills
  checks:
    - name: your written answers (study/notes/13-troubleshooting.md)
      file: study/notes/13-troubleshooting.md
    - name: all seven drills answered (### A ... ### G)
      grep: { path: study/notes/13-troubleshooting.md, pattern: '^###\s+[A-G]\b', min: 7 }

# =====================================================================================
# Security track: custom Terraform security modules, zero trust, least privilege, RBAC, secrets
# =====================================================================================
"14":
  title: "Custom module: kms-key with a least-privilege key policy"
  checks:
    - name: module exists
      file: terraform/modules/kms-key/main.tf
    - name: admin / usage / service-principal inputs
      grep: { path: terraform/modules/kms-key/variables.tf, pattern: 'variable "(admin_role_arns|usage_role_arns|service_principals)"', min: 3 }
    - name: rotation always on
      grep: { path: terraform/modules/kms-key/*.tf, pattern: 'enable_key_rotation\s*=\s*true' }
    - name: confused-deputy protection for service principals
      grep: { path: terraform/modules/kms-key/*.tf, pattern: 'aws:SourceAccount' }
    - name: at least 5 test runs
      grep: { path: terraform/modules/kms-key/tests/*.tftest.hcl, pattern: '^run "', min: 5 }
    - name: state-backend uses the module
      grep: { path: terraform/modules/state-backend/main.tf, pattern: 'module "kms"' }
    - name: no inline aws_kms_key left in state-backend
      absent: { path: terraform/modules/state-backend/main.tf, pattern: 'resource "aws_kms_key"' }
    - *tf_validate
    - *tf_test

"15":
  title: "Custom module: secure-bucket with a data perimeter"
  checks:
    - name: module exists
      file: terraform/modules/secure-bucket/main.tf
    - name: deny non-TLS
      grep: { path: terraform/modules/secure-bucket/*.tf, pattern: 'aws:SecureTransport' }
    - name: deny wrong / missing KMS key on upload
      grep: { path: terraform/modules/secure-bucket/*.tf, pattern: 'x-amz-server-side-encryption-aws-kms-key-id' }
    - name: network perimeter via VPC endpoint
      grep: { path: terraform/modules/secure-bucket/*.tf, pattern: 'aws:SourceVpce' }
    - name: break-glass exception
      grep: { path: terraform/modules/secure-bucket/*.tf, pattern: 'aws:PrincipalTag/break-glass' }
    - name: at least 5 test runs
      grep: { path: terraform/modules/secure-bucket/tests/*.tftest.hcl, pattern: '^run "', min: 5 }
    - name: microservice no longer has inline buckets
      absent: { path: terraform/modules/microservice/main.tf, pattern: 'resource "aws_s3_bucket"' }
    - name: network stack publishes the S3 endpoint id
      grep: { path: terraform/stacks/network/main.tf, pattern: 's3_vpce_id' }
    - *tf_validate
    - *tf_test

"16":
  title: Permissions boundaries + replace the admin CI role
  checks:
    - name: boundary module exists
      file: terraform/modules/permissions-boundary/main.tf
    - name: escalation prevention (roles must carry the boundary)
      grep: { path: terraform/modules/permissions-boundary/*.tf, pattern: 'iam:PermissionsBoundary' }
    - name: region lock
      grep: { path: terraform/modules/permissions-boundary/*.tf, pattern: 'aws:RequestedRegion' }
    - name: AdministratorAccess removed everywhere
      absent: { path: terraform/**/*.tf, pattern: 'AdministratorAccess' }
    - name: microservice roles are bounded
      grep: { path: terraform/modules/microservice/main.tf, pattern: 'permissions_boundary\s*=' }
    - name: eks-cluster roles are bounded
      grep: { path: terraform/modules/eks-cluster/main.tf, pattern: 'permissions_boundary\s*=' }
    - name: services stack (KEDA) role is bounded
      grep: { path: terraform/stacks/services/main.tf, pattern: 'permissions_boundary\s*=' }
    - name: SECURITY.md caveat resolved
      absent: { path: SECURITY.md, pattern: '(?m)^## Scope note' }
    - *tf_validate
    - *tf_test

"17":
  title: No secrets in Terraform state or tfvars
  checks:
    - name: ephemeral password generation
      grep: { path: terraform/**/*.tf, pattern: 'ephemeral\s+"random_password"' }
    - name: write-only arguments used
      grep: { path: terraform/**/*.tf, pattern: '_wo(_version)?\s*=', min: 2 }
    - name: no stateful random_password
      absent: { path: terraform/**/*.tf, pattern: 'resource\s+"random_password"' }
    - name: secret-leak guard test
      file: terraform/tests/test_no_secrets.py
    - name: guard runs in CI
      grep: { path: .github/workflows/validate.yaml, pattern: 'test_no_secrets' }
    - name: guard test passes
      run: python3 -m pytest -q -p no:cacheprovider terraform/tests/test_no_secrets.py
      needs: [python3]
    - *tf_test

"18":
  title: "No Secret manifests in Git: External Secrets Operator"
  checks:
    - name: ESO Argo CD app
      file: gitops/apps/external-secrets.yaml
    - name: ExternalSecret for the gateway
      grep: { path: platform/inference-gateway/*.yaml, pattern: 'kind:\s*ExternalSecret' }
    - name: namespaced SecretStore (not ClusterSecretStore)
      grep: { path: platform/inference-gateway/*.yaml, pattern: '(?m)^kind:\s*SecretStore\s*$' }
    - name: no Secret manifests under platform/
      absent: { path: platform/**/*.yaml, pattern: '(?m)^kind:\s*Secret\s*$' }
    - name: Rego rule denies Secret manifests
      grep: { path: policy/kubernetes/*.rego, pattern: 'input\.kind\s*==\s*"Secret"' }
    - name: at least 2 tests for it
      grep: { path: policy/kubernetes/*_test.rego, pattern: '(?im)^test_\w*secret\w* if', min: 2 }
    - *conftest_verify
    - *conftest_platform

