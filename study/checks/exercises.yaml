    - name: Security Hub
      grep: { path: terraform/modules/security-baseline/*.tf, pattern: 'resource "aws_securityhub_account"' }
    - name: AWS Config recorder
      grep: { path: terraform/modules/security-baseline/*.tf, pattern: 'resource "aws_config_configuration_recorder"' }
    - name: IAM Access Analyzer
