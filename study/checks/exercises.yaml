  checks:
    - name: default-deny in >= 3 workload namespaces
      grep: { path: platform/*/networkpolicy-default-deny.yaml, pattern: 'podSelector:\s*\{\}', min: 3 }
    - name: Rego rule requires default-deny per namespace
      grep: { path: policy/kubernetes/*.rego, pattern: '(?i)networkpolicy' }
    - name: e2e proves vLLM is unreachable from mlops
      grep: { path: tests/e2e/smoke_test.py, pattern: 'def test_zero_trust_vllm_unreachable_from_mlops' }
    - name: e2e proves the legitimate path still works
      grep: { path: tests/e2e/smoke_test.py, pattern: 'def test_zero_trust_gateway_path_still_works' }
    - *conftest_verify
    - *conftest_platform
    - *e2e

